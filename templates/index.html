<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcript Extractor</title>
    <!-- The CSS is the same as before -->
    <style>:root{--primary-color:#007bff;--secondary-color:#f8f9fa;--text-color:#333;--border-color:#dee2e6;--error-color:#dc3545;--success-color:#28a745}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;margin:0;padding:20px;background-color:var(--secondary-color);color:var(--text-color)}.container{max-width:800px;margin:20px auto;background-color:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}h1{text-align:center;color:var(--primary-color);margin-bottom:10px}p.instructions{text-align:center;color:#6c757d;margin-bottom:30px}#transcript-form{display:flex;gap:10px;margin-bottom:20px}#video-url{flex-grow:1;padding:12px;font-size:16px;border:1px solid var(--border-color);border-radius:5px;transition:border-color .2s,box-shadow .2s}#video-url:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(0,123,255,.25)}#submit-btn{padding:12px 20px;font-size:16px;background-color:var(--primary-color);color:#fff;border:none;border-radius:5px;cursor:pointer;transition:background-color .2s}#submit-btn:hover{background-color:#0056b3}#submit-btn:disabled{background-color:#a0c7ff;cursor:not-allowed}#loader{display:none;text-align:center;padding:20px;font-size:18px;color:#495057;font-style:italic}#result-container{margin-top:20px;padding:20px;border:1px solid var(--border-color);border-radius:5px;background-color:var(--secondary-color)}#result-container h2{margin-top:0;color:var(--primary-color);border-bottom:2px solid var(--border-color);padding-bottom:10px}#transcript-output{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.7;max-height:500px;overflow-y:auto;padding-right:10px}.error-message{color:var(--error-color);font-weight:700}.hidden{display:none}</style>
</head>
<body>
    <div class="container">
        <h1>YouTube Transcript Extractor</h1>
        <p class="instructions">Paste a YouTube video URL below to get its full transcript.</p>
        <form id="transcript-form">
            <input type="text" id="video-url" placeholder="e.g., https://www.youtube.com/watch?v=dQw4w9WgXcQ" required>
            <button type="submit" id="submit-btn">Get Transcript</button>
        </form>
        <div id="loader"></div>
        <div id="result-container" class="hidden">
            <h2 id="video-title"></h2>
            <pre id="transcript-output"></pre>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('transcript-form');
            const urlInput = document.getElementById('video-url');
            const submitBtn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('result-container');
            const videoTitleEl = document.getElementById('video-title');
            const transcriptOutputEl = document.getElementById('transcript-output');

            function extractVideoID(url) {
                const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
                const match = url.match(regExp);
                return match ? match[1] : null;
            }

            function updateLoader(message) {
                loader.textContent = message;
                loader.style.display = 'block';
            }

            function displayError(message) {
                loader.style.display = 'none';
                resultContainer.classList.remove('hidden');
                videoTitleEl.textContent = 'Error';
                transcriptOutputEl.innerHTML = `<p class="error-message">${message}</p>`;
            }
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); // This will now work reliably.

                const url = urlInput.value.trim();
                if (!url) return displayError("Please enter a YouTube video URL.");
                
                const videoID = extractVideoID(url);
                if (!videoID) return displayError("Could not find a valid YouTube Video ID in the URL.");

                submitBtn.disabled = true;
                resultContainer.classList.add('hidden');
                updateLoader('Sending request to local server...');

                try {
                    // This fetch request goes to our OWN Python server, not a public one.
                    const response = await fetch(`/get_transcript?videoId=${videoID}`);
                    const data = await response.json();

                    if (!response.ok) {
                        // The server sent back an error (e.g., 404, 500)
                        throw new Error(data.error || 'An unknown server error occurred.');
                    }
                    
                    // Success!
                    loader.style.display = 'none';
                    resultContainer.classList.remove('hidden');
                    videoTitleEl.textContent = `Transcript for Video ID: ${videoID}`;
                    transcriptOutputEl.textContent = data.transcript;

                } catch (error) {
                    console.error("Fetch failed:", error);
                    displayError(`Failed to get transcript: ${error.message}`);
                } finally {
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
